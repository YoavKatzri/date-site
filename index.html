<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebrew Dating Site</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            background-color: #f4f4f4;
        }
        header {
            background-color: #0079c1;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            color: white;
            background-color: #25d366;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <header>
        <h1>ברוכים הבאים לאתר ההיכרויות!</h1>
    </header>
    <div class="container">
        <h2>מצא את אהבתך</h2>
        <p>הירשם לאתר שלנו כדי להתחיל לחפש את הנפש התאומה שלך.</p>
        <a href="https://wa.me/your_phone_number" class="button">צור קשר בוואטסאפ</a>
    </div>
    <footer>
        <p>© 2026, אתר ההיכרויות</p>
    </footer>
</body>
</html>
