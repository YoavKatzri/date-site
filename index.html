<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Dating Site</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to the Interactive Dating Site</h1>
    </header>
    <main>
        <section id="profile-creation">
            <h2>Create Your Profile</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required>
                <label for="interests">Interests:</label>
                <input type="text" id="interests" name="interests" required>
                <input type="submit" value="Create Profile">
            </form>
        </section>
        <section id="matchmaking">
            <h2>Find Your Match</h2>
            <button id="find-match">Find Match</button>
            <div id="match-results"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Interactive Dating Site. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
